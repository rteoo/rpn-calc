name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer commit supersedes older validation for the same branch or PR.
# Release tags use the separate release workflow and are not cancelled here.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon-x11-0 libglib2.0-0 libfontconfig1 \
            libfreetype6 libnss3
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  macos-app:
    # Issue #15 / #17: offscreen pytest is not a real window, and a broken
    # PyInstaller spec must fail the PR rather than a tagged release.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - name: Smoke from source (cocoa)
        run: python tools/smoke_macos.py --source
      - name: Build .app
        run: python tools/build_exe.py
      - name: Smoke the bundle
        run: python tools/smoke_macos.py dist/rpn-calc.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpn-calc-macos
          path: dist/rpn-calc.app.zip
          if-no-files-found: error
